name: iPhotoExifEditor

options:
  bundleIdPrefix: work.mumuxijili
  deploymentTarget:
    iOS: "17.0"

targets:
  iPhotoExifEditor:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.mumuxijili.iphotoexifeditor
        PRODUCT_NAME: iPhotoExifEditor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: iPhotoExifEditor
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "需要读取并修改你明确选择的照片位置和拍摄日期"
        INFOPLIST_KEY_PHPhotoLibraryPreventAutomaticLimitedAccessAlert: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
