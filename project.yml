name: iPhotoExifEditor

options:
  bundleIdPrefix: work.mumuxijili
  deploymentTarget:
    iOS: "17.0"

targets:
  iPhotoExifEditor:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.mumuxijili.iphotoexifeditor
        PRODUCT_NAME: iPhotoExifEditor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "7"
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
